name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx_standard: 20
          - os: windows-latest
            compiler: msvc
            cxx_standard: 20

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run smoke test
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            .\build\Debug\peruser.exe
          else
            ./build/peruser
          fi
        shell: bash

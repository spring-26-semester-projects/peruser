name: Dev Release

on:
  push:
    branches: [dev]

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: peruser
            asset_name: peruser-linux-x64

          - os: windows-latest
            artifact_name: peruser.exe
            asset_name: peruser-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run smoke test
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            .\build\Release\peruser.exe
          else
            ./build/peruser
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: build/${{ matrix.artifact_name }}

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: peruser-linux-x64
          path: artifacts/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: peruser-windows-x64.exe
          path: artifacts/

      - name: Create or update dev release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev
          name: Dev Build
          prerelease: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
